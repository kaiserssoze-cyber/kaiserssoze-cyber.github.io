<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blogs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>:root{--bg:#F4F2EE;--ink:#16161C}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--sub);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}
.top{background:var(--ac);color:var(--act);margin:0 -16px;padding:30px 22px 26px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.kick{font-size:11px;font-weight:800;letter-spacing:.22em;opacity:.8}
h1{margin:6px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.one{margin:8px 0 0;font-size:13.5px;opacity:.85;max-width:30em}
.stat{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.stat span{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.22)}
.find{margin:18px 0 0;position:relative}
.find input{width:100%;font:inherit;font-size:15px;padding:13px 16px 13px 42px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.find input:focus{outline:none;border-color:var(--sub)}
.find svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
h2{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--sub);margin:28px 0 10px}
.hero{display:block;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.04),0 12px 30px rgba(0,0,0,.08)}
.hero .ph{aspect-ratio:16/9;background:var(--ac) center/cover no-repeat;position:relative}
.hero .new{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;letter-spacing:.1em;background:var(--sub);color:#fff;padding:4px 9px;border-radius:7px}
.hero .bd{padding:14px 16px 16px}
.hero .tt{font-size:18px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.meta{margin-top:6px;font-size:12px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05)}
.row .ph{flex:0 0 84px;height:84px;border-radius:10px;background:var(--ac) center/cover no-repeat}
.row .ph.none{display:flex;align-items:center;justify-content:center;color:var(--act);font-weight:800;font-size:22px}
.row .tt{font-size:14.5px;font-weight:700;line-height:1.42;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero:active,.row:active,.it:active{transform:scale(.992)}
details{background:#fff;border-radius:14px;margin-top:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary .nm{flex:1}
summary .n{font-size:12px;font-weight:800;color:var(--act);background:var(--ac);padding:2px 9px;border-radius:999px}
summary .ar{transition:transform .2s;opacity:.5}
details[open] summary .ar{transform:rotate(90deg)}
details ul{list-style:none;margin:0;padding:0 8px 8px}
.it{display:flex;gap:10px;align-items:baseline;padding:11px 8px;border-top:1px solid var(--line)}
.it .tt{flex:1;font-size:14px;line-height:1.45}
.it .dt{flex:none;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.foot{margin-top:30px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.home{display:block;text-align:center;font-weight:800;padding:15px;border-radius:14px;background:var(--ink);color:var(--bg)}
.made{text-align:center;font-size:11px;color:var(--mute)}
.hide{display:none!important}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="wrap" style="padding-top:40px"><a class="home" style="margin-top:10px;background:#FFB300;color:#16161C" href="./iwonder/">아이원더</a><a class="home" style="margin-top:10px;background:#EC6A32;color:#FFFFFF" href="./tripmeter/">트립미터</a><a class="home" style="margin-top:10px;background:#14213D;color:#FFFFFF" href="./bygk/">Before You Go Korea</a></div></body></html>
